<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1500" viewBox="0 0 1500 1500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020817"/>
      <stop offset="0.55" stop-color="#061229"/>
      <stop offset="1" stop-color="#010409"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1fb6ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1fb6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="layerFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e2a4d"/>
      <stop offset="1" stop-color="#071a33"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- banner band centered in 1500x1500 (y 450..1050) -->
  <g transform="translate(0,450)">
    <!-- background -->
    <rect width="1500" height="600" fill="url(#bg)"/>

    <!-- faint grid -->
    <g stroke="#1a3a5c" stroke-opacity="0.18" stroke-width="1">
      <line x1="0" y1="120" x2="1500" y2="120"/>
      <line x1="0" y1="240" x2="1500" y2="240"/>
      <line x1="0" y1="360" x2="1500" y2="360"/>
      <line x1="0" y1="480" x2="1500" y2="480"/>
      <line x1="250" y1="0" x2="250" y2="600"/>
      <line x1="500" y1="0" x2="500" y2="600"/>
      <line x1="750" y1="0" x2="750" y2="600"/>
      <line x1="1000" y1="0" x2="1000" y2="600"/>
      <line x1="1250" y1="0" x2="1250" y2="600"/>
    </g>

    <!-- ambient glows -->
    <ellipse cx="1180" cy="170" rx="380" ry="260" fill="url(#glow)"/>
    <ellipse cx="250" cy="520" rx="320" ry="220" fill="url(#glow)" opacity="0.5"/>

    <!-- title -->
    <text x="90" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#eaf6ff">The AI Security Stack</text>
    <text x="92" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#7fb6e6" letter-spacing="2">IDENTITY &#8594; ENDPOINT &#8594; CODE &#8594; AI</text>

    <!-- four stacked layers -->
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
      <g>
        <rect x="90" y="270" width="1320" height="62" rx="10" fill="url(#layerFill)" stroke="#1fb6ff" stroke-opacity="0.65" stroke-width="1.5"/>
        <circle cx="130" cy="301" r="9" fill="#1fb6ff" filter="url(#soft)"/>
        <circle cx="130" cy="301" r="6" fill="#bfe9ff"/>
        <text x="165" y="310" font-size="26" font-weight="600" fill="#eaf6ff">Identity</text>
        <text x="360" y="310" font-size="20" fill="#86a9c9">Who is allowed in?</text>
        <text x="1380" y="310" font-size="22" font-weight="600" fill="#5fd0ff" text-anchor="end">Okta</text>
      </g>
      <g>
        <rect x="90" y="345" width="1320" height="62" rx="10" fill="url(#layerFill)" stroke="#1fb6ff" stroke-opacity="0.55" stroke-width="1.5"/>
        <circle cx="130" cy="376" r="9" fill="#1fb6ff" filter="url(#soft)"/>
        <circle cx="130" cy="376" r="6" fill="#bfe9ff"/>
        <text x="165" y="385" font-size="26" font-weight="600" fill="#eaf6ff">Endpoint</text>
        <text x="360" y="385" font-size="20" fill="#86a9c9">What is running on our machines?</text>
        <text x="1380" y="385" font-size="22" font-weight="600" fill="#5fd0ff" text-anchor="end">CrowdStrike</text>
      </g>
      <g>
        <rect x="90" y="420" width="1320" height="62" rx="10" fill="url(#layerFill)" stroke="#1fb6ff" stroke-opacity="0.55" stroke-width="1.5"/>
        <circle cx="130" cy="451" r="9" fill="#1fb6ff" filter="url(#soft)"/>
        <circle cx="130" cy="451" r="6" fill="#bfe9ff"/>
        <text x="165" y="460" font-size="26" font-weight="600" fill="#eaf6ff">Code</text>
        <text x="360" y="460" font-size="20" fill="#86a9c9">What are we shipping in our software?</text>
        <text x="1380" y="460" font-size="22" font-weight="600" fill="#5fd0ff" text-anchor="end">Snyk</text>
      </g>
      <g>
        <rect x="90" y="495" width="1320" height="62" rx="10" fill="#0c3a4a" stroke="#33e0ff" stroke-opacity="0.9" stroke-width="2"/>
        <circle cx="130" cy="526" r="10" fill="#33e0ff" filter="url(#soft)"/>
        <circle cx="130" cy="526" r="6" fill="#e6fbff"/>
        <text x="165" y="535" font-size="26" font-weight="700" fill="#eaffff">AI / LLM</text>
        <text x="360" y="535" font-size="20" fill="#9fe6f5">What is our model saying and doing?</text>
        <text x="1380" y="535" font-size="22" font-weight="700" fill="#7df0ff" text-anchor="end">Lakera</text>
      </g>
    </g>
  </g>
</svg>
