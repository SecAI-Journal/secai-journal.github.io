<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1500" viewBox="0 0 1500 1500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020817"/>
      <stop offset="0.55" stop-color="#061229"/>
      <stop offset="1" stop-color="#010409"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1fb6ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1fb6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowWarn" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a3c" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff8a3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="attacker" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a3c"/>
      <stop offset="1" stop-color="#ff5a3c"/>
    </linearGradient>
    <linearGradient id="topsheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1500" height="1500" fill="url(#bg)"/>

  <g transform="translate(0,450)">
    <rect width="1500" height="600" fill="url(#bg)"/>

    <!-- faint grid -->
    <g stroke="#1a3a5c" stroke-opacity="0.18" stroke-width="1">
      <line x1="0" y1="120" x2="1500" y2="120"/>
      <line x1="0" y1="240" x2="1500" y2="240"/>
      <line x1="0" y1="360" x2="1500" y2="360"/>
      <line x1="0" y1="480" x2="1500" y2="480"/>
      <line x1="250" y1="0" x2="250" y2="600"/>
      <line x1="500" y1="0" x2="500" y2="600"/>
      <line x1="750" y1="0" x2="750" y2="600"/>
      <line x1="1000" y1="0" x2="1000" y2="600"/>
      <line x1="1250" y1="0" x2="1250" y2="600"/>
    </g>

    <ellipse cx="1200" cy="150" rx="380" ry="240" fill="url(#glowWarn)"/>
    <ellipse cx="230" cy="520" rx="320" ry="220" fill="url(#glow)" opacity="0.5"/>

    <!-- title -->
    <text x="90" y="150" font-size="58" font-weight="700" fill="#eaf6ff">One Request to Stall Them All</text>
    <text x="92" y="200" font-size="26" font-weight="400" fill="#7fb6e6" letter-spacing="2">DENIAL OF SERVICE IN THE vLLM SCHEDULER</text>

    <!-- the shared token budget bar -->
    <text x="90" y="300" font-size="22" fill="#86a9c9" letter-spacing="1">SHARED TOKEN BUDGET &#183; ONE STEP</text>
    <g>
      <rect x="90" y="320" width="1320" height="78" rx="14" fill="#0b1a30" stroke="#22405f" stroke-width="1.5"/>
      <!-- attacker monopolises most of the budget -->
      <rect x="90" y="320" width="1150" height="78" rx="14" fill="url(#attacker)"/>
      <rect x="90" y="320" width="1150" height="39" rx="14" fill="url(#topsheen)"/>
      <text x="120" y="368" font-size="26" font-weight="700" fill="#3a0f00">attacker requests fill the budget</text>
      <!-- thin leftover sliver -->
      <text x="1258" y="368" font-size="22" fill="#7fb6e6">leftover</text>
    </g>

    <!-- starved victim -->
    <g>
      <rect x="90" y="430" width="520" height="66" rx="12" fill="#0c1f14" stroke="#33e0ff" stroke-opacity="0.8" stroke-width="2" stroke-dasharray="9 7"/>
      <circle cx="130" cy="463" r="9" fill="#33e0ff"/>
      <text x="158" y="472" font-size="24" font-weight="600" fill="#bfe9ff">your prompt</text>
      <text x="640" y="472" font-size="24" fill="#86a9c9">waiting&#8230; never scheduled</text>
    </g>
  </g>
</svg>
